{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>Sign in</h1>
  <form method="post">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required autofocus>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required>
    <div class="actions"><button class="btn" type="submit">Sign in</button></div>
  </form>
  <p class="muted">Landlord or agent? <a href="{{ url_for('register') }}">Create an account</a>.</p>
  <p class="muted">Students can browse and book without an account.</p>
</div>
{% endblock %}
