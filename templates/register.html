{% extends "base.html" %}
{% block title %}Landlord sign up{% endblock %}
{% block content %}
<div class="card narrow">
  <h1>List your hostel</h1>
  <p class="muted">Create a landlord / agent account to publish accommodation.</p>
  <form method="post">
    <label for="full_name">Full name</label>
    <input id="full_name" name="full_name" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required minlength="6">
    <label for="phone">Phone</label>
    <input id="phone" name="phone" inputmode="tel">
    <label for="institution">Nearest university</label>
    <select id="institution" name="institution">
      <option value="">Select</option>
      {% for u in universities %}<option value="{{ u }}">{{ u }}</option>{% endfor %}
    </select>
    <label for="gender">Title</label>
    <select id="gender" name="gender">
      <option value="male">Mr</option>
      <option value="female">Mrs</option>
    </select>
    <div class="actions"><button class="btn" type="submit">Create account</button></div>
  </form>
  <p class="muted">Already registered? <a href="{{ url_for('login') }}">Sign in</a>.</p>
</div>
{% endblock %}
